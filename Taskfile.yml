version: '3'

# Taskfile for this project.
# Installed by deft-install --yes (Epic-4). Add your own tasks below or in
# additional included files. The deft include makes all framework tasks
# (task check, task vbrief:*, task doctor, etc.) available from the project root.

includes:
  deft:
    taskfile: ./.deft/core/Taskfile.yml
    optional: true

tasks:
  spec-drift:
    desc: "Fail when a recorded status disagrees with the tree (specs, xBRIEFs, schema). --offline skips the gh rule."
    cmds:
      - python3 scripts/spec_drift_check.py {{.CLI_ARGS}}

  spec-drift:selftest:
    desc: "Prove the spec-drift rules can both fire and stay silent, offline."
    cmds:
      - python3 scripts/spec_drift_check.py --selftest
      - python3 -m unittest discover -s scripts -p "test_*.py"
